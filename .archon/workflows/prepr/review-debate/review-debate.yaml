name: prepr
description: Run two selected reviewer skills through independent agents, debate disagreements, and report their attributed conclusions.
inputs:
  base:
    default: ""
    description: Optional comparison ref or commit for branch scope only.
  preview_only:
    default: "false"
    description: Display scope and stop before reviewer selection or model probes.
  scope:
    default: "local"
    description: local reviews uncommitted changes; branch reviews clean local HEAD since its merge base with the verified origin default branch.
  reviewer_a:
    default: ""
    description: Optional local reviewer profile name or direct skill reference for side A.
  reviewer_b:
    default: ""
    description: Optional local reviewer profile name or direct skill reference for side B.
  reviewer_a_launcher:
    default: ""
    description: Required launcher (codex or claude) when reviewer_a is a direct skill reference.
  reviewer_b_launcher:
    default: ""
    description: Required launcher (codex or claude) when reviewer_b is a direct skill reference.
  reviewer_a_model:
    default: ""
    description: Optional model pin when reviewer_a is a direct skill reference.
  reviewer_b_model:
    default: ""
    description: Optional model pin when reviewer_b is a direct skill reference.
returns: report
mutates_checkout: false
nodes:
  - id: select-reviewers
    script: select-reviewers
    runtime: bun
    depends_on: [capture-diff]
    when: "$capture-diff.output.previewOnly != true"
    timeout: 180000
    with:
      evidence_only: "true"
      reviewer_a: "$INPUTS.reviewer_a"
      reviewer_b: "$INPUTS.reviewer_b"
      reviewer_a_launcher: "$INPUTS.reviewer_a_launcher"
      reviewer_b_launcher: "$INPUTS.reviewer_b_launcher"
      reviewer_a_model: "$INPUTS.reviewer_a_model"
      reviewer_b_model: "$INPUTS.reviewer_b_model"

  - id: capture-diff
    script: capture-diff
    runtime: bun
    timeout: 120000
    with:
      scope: "$INPUTS.scope"
      base: "$INPUTS.base"
      preview_only: "$INPUTS.preview_only"

  - id: initial-reviewer-a
    script: run-initial
    runtime: bun
    timeout: 615000
    depends_on: [capture-diff, select-reviewers]
    with:
      evidence_only: "true"
      reviewer_side: "a"

  - id: initial-reviewer-b
    script: run-initial
    runtime: bun
    timeout: 615000
    depends_on: [capture-diff, select-reviewers]
    with:
      evidence_only: "true"
      reviewer_side: "b"

  - id: comparison
    script: compare
    runtime: bun
    depends_on: [initial-reviewer-a, initial-reviewer-b]
    with:
      evidence_only: "true"

  - id: debates
    include: prepr-debate-reviewer
    depends_on: [comparison]
    when: "$comparison.output.hasDisputes == true"
    fan_out:
      items: "$comparison.output.disputeIds"
      as: dispute_index
      max_parallel: 1
      join: all_done

  - id: report
    script: report
    runtime: bun
    depends_on: [capture-diff, comparison, debates]
    trigger_rule: all_done
    output_format:
      type: object
      properties:
        preview:
          type: object
          additionalProperties: true
        report:
          type: object
          properties:
            type: { const: archon_artifact }
            run_id: { type: string }
            path: { const: prepr-report.md }
          required: [type, run_id, path]
        data:
          type: object
          properties:
            type: { const: archon_artifact }
            run_id: { type: string }
            path: { const: prepr-report.json }
          required: [type, run_id, path]
      anyOf:
        - required: [report, data]
        - required: [preview]

  - id: verify-run
    script: verify-run
    runtime: bun
    depends_on: [report]
    trigger_rule: all_done
